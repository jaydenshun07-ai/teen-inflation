name: Monthly CPI update
on:
  schedule:
    - cron: "0 2 25 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest CPI and update the page
        run: python update.py
      - name: Commit if the data changed
        run: |
          git config user.name "cpi-bot"
          git config user.email "cpi-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Update CPI data" && git push)
